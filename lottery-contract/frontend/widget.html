<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-Lottery Checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e4e4e7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .widget { background: linear-gradient(135deg, #18181b 0%, #0f0f12 100%); border: 1px solid #27272a; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); }
    .product { display: flex; gap: 16px; margin-bottom: 24px; }
    .product-img { width: 80px; height: 80px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 16px; font-weight: 600; color: #fafafa; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-desc { font-size: 13px; color: #71717a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-top: 1px solid #27272a; border-bottom: 1px solid #27272a; margin-bottom: 20px; }
    .price-label { font-size: 14px; color: #a1a1aa; }
    .price-amount { font-size: 24px; font-weight: 700; color: #fafafa; font-variant-numeric: tabular-nums; }
    .btn { width: 100%; padding: 16px 24px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-loading { display: none; }
    .btn.loading .btn-text { display: none; }
    .btn.loading .btn-loading { display: flex; }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; }
    .status.success { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; }
    .status.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
    .status.pending { display: block; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; }
    .tx-link { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .footer { margin-top: 20px; text-align: center; font-size: 11px; color: #52525b; }
    .footer a { color: #8b5cf6; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="product">
      <div class="product-img" id="productImg">🎧</div>
      <div class="product-info">
        <div class="product-name" id="productName">Wireless Pro Headphones</div>
        <div class="product-desc" id="productDesc">Premium noise-cancelling, 40hr battery</div>
      </div>
    </div>
    <div class="price-row">
      <span class="price-label">Ticket Price</span>
      <span class="price-amount" id="priceAmount">10 HBAR</span>
    </div>
    <button class="btn btn-primary" id="checkoutBtn" onclick="handleCheckout()">
      <span class="btn-text">Enter Lottery →</span>
      <span class="btn-loading"><span class="spinner"></span> Connecting...</span>
    </button>
    <div class="status" id="status"></div>
    <div class="footer">
      Powered by <a href="https://hedera.com" target="_blank">Hedera</a> • Smart Contract: <span id="contractAddr">0x...</span>
    </div>
  </div>

  <script>
    // CONFIGURATION — replace with your deployed values
    const CONFIG = {
      contractId: '0.0.10995401',        // Hedera Contract ID (from mirror node lookup)
      contractEvmAddress: '0x9EaF48a7D2D1C1FFD206B4082F39e41fA23f26B1',      // EVM address of deployed contract
      ticketPriceHbar: 10,              // HBAR per ticket
      productName: 'Wireless Pro Headphones',
      productDesc: 'Premium noise-cancelling, 40hr battery',
      productEmoji: '🎧',
      network: 'testnet',               // 'testnet' | 'mainnet'
      rpcUrl: 'https://testnet.hashio.io/api', // Hedera JSON-RPC relay
    };

    // Initialize UI
    document.getElementById('productName').textContent = CONFIG.productName;
    document.getElementById('productDesc').textContent = CONFIG.productDesc;
    document.getElementById('productImg').textContent = CONFIG.productEmoji;
    document.getElementById('priceAmount').textContent = `${CONFIG.ticketPriceHbar} HBAR`;
    document.getElementById('contractAddr').textContent = CONFIG.contractEvmAddress;

    let walletConnected = false;
    let signer = null;

    async function handleCheckout() {
      const btn = document.getElementById('checkoutBtn');
      const status = document.getElementById('status');

      if (!walletConnected) {
        await connectWallet();
        if (!walletConnected) return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      status.className = 'status pending';
      status.textContent = 'Submitting transaction...';

      try {
        const txHash = await buyTicket();
        status.className = 'status pending';
        status.innerHTML = `Transaction submitted! <a class="tx-link" href="https://hashscan.io/${CONFIG.network}/tx/${txHash}" target="_blank">View on HashScan</a>`;

        // Poll for receipt
        const receipt = await waitForReceipt(txHash);
        if (receipt.status === 'SUCCESS') {
          status.className = 'status success';
          status.innerHTML = `🎉 Ticket purchased! Check <a class="tx-link" href="https://hashscan.io/${CONFIG.network}/tx/${txHash}" target="_blank">HashScan</a> for confirmation.`;
        } else {
          throw new Error(`Transaction failed: ${receipt.status}`);
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = `Error: ${err.message}`;
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    async function connectWallet() {
      const status = document.getElementById('status');
      const btn = document.getElementById('checkoutBtn');

      // Detect HashPack / Blade / MetaMask (Hedera-compatible)
      const provider = window.ethereum || window.hashpack || window.blade;
      if (!provider) {
        status.className = 'status error';
        status.innerHTML = 'No Hedera wallet detected. Install <a class="tx-link" href="https://hashpack.app" target="_blank">HashPack</a> or <a class="tx-link" href="https://bladewallet.io" target="_blank">Blade</a>.';
        return;
      }

      try {
        btn.classList.add('loading');
        btn.disabled = true;
        status.className = 'status pending';
        status.textContent = 'Connecting wallet...';

        const accounts = await provider.request({ method: 'eth_requestAccounts' });
        if (!accounts.length) throw new Error('No accounts returned');

        signer = provider;
        walletConnected = true;
        btn.querySelector('.btn-text').textContent = `Enter Lottery (${accounts[0].slice(0,6)}...${accounts[0].slice(-4)})`;
        status.className = 'status success';
        status.textContent = 'Wallet connected!';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
      } catch (err) {
        status.className = 'status error';
        status.textContent = `Connection failed: ${err.message}`;
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    async function buyTicket() {
      // Contract ABI fragment for buyTicket()
      const abi = [
        'function buyTicket() external payable returns (uint256 ticketId)'
      ];
      const iface = new ethers.utils.Interface(abi);
      const data = iface.encodeFunctionData('buyTicket', []);

      const tx = {
        to: CONFIG.contractEvmAddress,
        data: data,
        value: ethers.utils.parseEther(CONFIG.ticketPriceHbar.toString()),
        gasLimit: 300000,
      };

      // Use eth_sendTransaction via provider
      const txHash = await signer.request({
        method: 'eth_sendTransaction',
        params: [tx],
      });

      return txHash;
    }

    async function waitForReceipt(txHash, maxAttempts = 30) {
      for (let i = 0; i < maxAttempts; i++) {
        await new Promise(r => setTimeout(r, 2000));
        try {
          const receipt = await signer.request({
            method: 'eth_getTransactionReceipt',
            params: [txHash],
          });
          if (receipt) return receipt;
        } catch (_) {}
      }
      throw new Error('Receipt polling timeout');
    }

    // Load ethers.js from CDN
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js';
    script.onload = () => { window.ethers = ethers; };
    document.head.appendChild(script);
  </script>
</body>
</html>
