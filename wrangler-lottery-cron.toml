name = "hedera-lottery-cron"
main = "dist/lottery-cron.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
LOTTERY_CONTRACT_ADDRESS = "0x0e1421ADC7089E9e537c86a4fa8bB07498164DfB"
LOTTERY_RPC_URL = "https://testnet.hashio.io/api"

# Deploy to workers.dev subdomain
host = "mobicobe.workers.dev"

[triggers]
crons = ["0 12 * * 0"]  # Weekly Sunday 12:00 UTC

# Secrets (set via: wrangler secret put SECRET_NAME)
# ADMIN_PRIVATE_KEY
# DISCORD_WEBHOOK_URL (optional)
# TWITTER_API_KEY (optional)
# TWITTER_API_SECRET (optional)
# TWITTER_ACCESS_TOKEN (optional)
# TWITTER_ACCESS_SECRET (optional)