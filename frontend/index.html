<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hedera Micropayments Demo</title>
  <style>
    :root {
      --bg: #0f172a; --bg-card: #1e293b; --border: #334155;
      --text: #e2e8f0; --text-muted: #94a3b8;
      --primary: #7c3aed; --primary-hover: #8b5cf6;
      --success: #10b981; --error: #ef4444; --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; min-height: 100vh; }
    .app { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2); }
    .btn { width: 100%; padding: 14px 20px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: white; }
    .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); transform: translateY(-1px); }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    .btn-success:hover:not(:disabled) { background: linear-gradient(135deg, #34d399 0%, #10b981 100%); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); width: auto; }
    .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .status { padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
    .status.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
    .status.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .status.info { background: rgba(124, 58, 237, 0.15); border: 1px solid rgba(124, 58, 237, 0.3); color: #c4b5fd; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status.success .status-dot { background: var(--success); }
    .status.error .status-dot { background: var(--error); }
    .status.info .status-dot { background: var(--primary); }
    .balance-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .balance-row:last-child { border-bottom: none; }
    .balance-label { color: var(--text-muted); font-size: 0.9rem; }
    .balance-value { font-weight: 600; font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .spinner { width: 18px; height: 18px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .qr-container { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 0; }
    .qr-code { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
    .qr-instruction { text-align: center; color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; }
    .qr-instruction strong { color: var(--text); }
    .quote-display { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 12px; }
    .quote-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .quote-row:last-child { border-bottom: none; }
    .quote-label { color: var(--text-muted); }
    .quote-value { font-weight: 600; font-family: 'SF Mono', Monaco, monospace; }
    .hidden { display: none !important; }
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 14px 20px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); animation: slideIn 0.3s ease; max-width: 360px; }
    .toast.success { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); border: 1px solid #10b981; color: #a7f3d0; }
    .toast.error { background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%); border: 1px solid #ef4444; color: #fecaca; }
    .toast.info { background: linear-gradient(135deg, #312e81 0%, #3730a3 100%); border: 1px solid #7c3aed; color: #ddd6fe; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 520px) { .app { padding: 16px; } .card { padding: 16px; } }
    .section { margin-bottom: 20px; }
    .section:last-child { margin-bottom: 0; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <h1>Hedera Micropayments</h1>
      <p class="subtitle">Buy API Credits (APIC) with HBAR</p>
    </header>
    <div id="content"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- WalletConnect & Hedera SDK loaded via CDN -->
  <script type="module">
    import { DAppConnector, LedgerId } from 'https://esm.sh/@hashgraph/hedera-wallet-connect@1.5.1';
    import { Client, AccountId, Transaction, TransferTransaction, Hbar } from 'https://esm.sh/@hashgraph/sdk@2.81.0';

    // Polyfill Buffer
    if (typeof window !== 'undefined' && !window.Buffer) {
      const { Buffer } = await import('https://esm.sh/buffer@6.0.3');
      window.Buffer = Buffer;
    }

    // Configuration - UPDATE THESE
    const CONFIG = {
      tokenId: '0.0.10957488',           // Your APIC token ID (newly deployed)
      treasuryId: '0.0.1073622',        // Treasury account (receives HBAR)
      pricePerToken: 1000,             // tinybars per token
      defaultAmount: 100,
      network: 'testnet',
      projectId: 'YOUR_WALLETCONNECT_PROJECT_ID', // Get from cloud.walletconnect.com
      backendUrl: ''                   // Empty = same origin (uses Vite proxy in dev)
    };

    // State
    let connector = null;
    let connected = false;
    let connecting = false;
    let accountId = null;
    let balance = { tokenBalance: 0, hbarBalance: 0 };
    let quote = null;
    let purchasing = false;
    let initialized = false;

    // DOM Elements
    const content = document.getElementById('content');
    const toastContainer = document.getElementById('toastContainer');

    // Helpers
    function formatTinybars(tinybars) {
      const hbar = tinybars / 100_000_000;
      return hbar < 0.0001 ? `${tinybars.toLocaleString()} tinybars` : `${hbar.toFixed(8)} HBAR`;
    }
    function formatAccountId(id) { return `${id.slice(0, 8)}...${id.slice(-4)}`; }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      toast.onclick = () => toast.remove();
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    function setError(err) {
      if (err) showToast(err, 'error');
    }

    function render() {
      if (!connected) {
        content.innerHTML = `
          <div class="card">
            <div class="card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
              Connect Wallet
            </div>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">
              Scan QR code with HashPack or Blade wallet to connect
            </p>
            <button class="btn btn-primary" id="connectBtn" ${connecting ? 'disabled' : ''}>
              ${connecting ? '<span class="spinner"></span>Connecting...' : 'Connect Wallet'}
            </button>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 12px; text-align: center;">
              Supports HashPack, Blade, and other WalletConnect v2 wallets
            </p>
          </div>
        `;
        document.getElementById('connectBtn')?.addEventListener('click', handleConnect);
      } else {
        content.innerHTML = `
          <div class="card">
            <div class="card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
              Connected
            </div>
            <div class="flex-between" style="margin-bottom: 16px">
              <span style="font-family: monospace; font-size: 0.9rem">${formatAccountId(accountId)}</span>
              <button class="btn btn-outline" id="disconnectBtn" style="width: auto; padding: 8px 16px">Disconnect</button>
            </div>
            ${balance ? `
              <div>
                <div class="balance-row">
                  <span class="balance-label">APIC Tokens</span>
                  <span class="balance-value">${balance.tokenBalance.toLocaleString()}</span>
                </div>
                <div class="balance-row">
                  <span class="balance-label">HBAR Balance</span>
                  <span class="balance-value">${formatTinybars(balance.hbarBalance)}</span>
                </div>
              </div>
            ` : ''}
          </div>

          <div class="card">
            <div class="card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
              Purchase API Credits
            </div>
            
            <div class="section">
              <label>Amount</label>
              <input type="number" id="amountInput" min="1" max="1000000" value="${CONFIG.defaultAmount}" placeholder="Enter amount">
            </div>

            ${quote ? `
              <div class="quote-display">
                <div class="quote-row"><span class="quote-label">Tokens</span><span class="quote-value">${quote.tokenAmount.toLocaleString()} APIC</span></div>
                <div class="quote-row"><span class="quote-label">Price per token</span><span class="quote-value">${formatTinybars(quote.feeBreakdown.tokenPrice)}</span></div>
                <div class="quote-row"><span class="quote-label">Est. network fee</span><span class="quote-value">${formatTinybars(quote.feeBreakdown.networkFee)}</span></div>
                <div class="quote-row" style="border-top: 2px solid var(--border); margin-top: 8px; padding-top: 12px">
                  <span class="quote-label">Total</span><span class="quote-value" style="color: var(--primary)">${formatTinybars(quote.hbarCost)}</span>
                </div>
              </div>
            ` : ''}

            <button class="btn btn-success" id="purchaseBtn" ${purchasing || !connected ? 'disabled' : ''} style="margin-top: 16px">
              ${purchasing ? '<span class="spinner"></span>Processing...' : `Buy ${parseInt(document.getElementById('amountInput')?.value || CONFIG.defaultAmount).toLocaleString()} APIC`}
            </button>

            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 12px; text-align: center;">
              Each API call uses 1 token + auto-fee to treasury
            </p>
          </div>
        `;
        
        document.getElementById('disconnectBtn')?.addEventListener('click', handleDisconnect);
        document.getElementById('purchaseBtn')?.addEventListener('click', handlePurchase);
        document.getElementById('amountInput')?.addEventListener('input', (e) => {
          const val = Math.max(1, parseInt(e.target.value) || 1);
          e.target.value = val;
          if (connected) fetchQuote(val);
        });
      }
    }

    // WalletConnect initialization
    async function initialize() {
      if (initialized) return;
      try {
        connector = new DAppConnector(
          { name: 'Hedera Micropayments Demo', description: 'Buy API credits with HBAR', url: window.location.origin, icons: ['https://hedera.com/favicon.ico'] },
          CONFIG.network === 'mainnet' ? LedgerId.MAINNET : LedgerId.TESTNET,
          CONFIG.projectId,
          ['hedera_signTransaction', 'hedera_signAndExecuteTransaction', 'hedera_signMessage', 'hedera_signAndExecuteQuery'],
          ['hedera_accountsChanged', 'hedera_chainChanged'],
          [`hedera:${CONFIG.network}`],
          'info'
        );
        await connector.init({ logger: 'info' });
        initialized = true;
      } catch (err) {
        setError(err.message || 'Failed to initialize wallet');
        throw err;
      }
    }

    async function handleConnect() {
      connecting = true; render();
      try {
        const session = await connector.openModal();
        if (!session.namespaces?.hedera?.accounts?.length) throw new Error('No Hedera accounts in session');
        const acctId = session.namespaces.hedera.accounts[0].split(':').pop();
        accountId = acctId; connected = true;
        await fetchBalance(acctId);
      } catch (err) { setError(err.message || 'Failed to connect wallet'); }
      finally { connecting = false; render(); }
    }

    async function handleDisconnect() {
      try { if (connector) await connector.disconnectAll(); }
      catch (err) { setError(err.message || 'Failed to disconnect'); }
      connected = false; accountId = null; balance = { tokenBalance: 0, hbarBalance: 0 }; quote = null;
      render();
    }

    async function fetchBalance(acctId) {
      try {
        const res = await fetch(`/api/token/${CONFIG.tokenId}/balance/${acctId}`);
        if (res.ok) {
          const data = await res.json();
          balance = { tokenBalance: data.tokenBalance, hbarBalance: data.hbarBalance };
        }
      } catch (err) { console.error('Failed to fetch balance:', err); }
    }

    async function fetchQuote(tokenAmount) {
      try {
        const res = await fetch('/api/quote', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tokenAmount })
        });
        if (res.ok) { quote = await res.json(); render(); }
        else throw new Error('Failed to fetch quote');
      } catch (err) { setError(err.message || 'Failed to fetch quote'); }
    }

    async function handlePurchase() {
      const tokenAmount = parseInt(document.getElementById('amountInput')?.value || CONFIG.defaultAmount);
      purchasing = true; render();
      try {
        if (!connector || !accountId) throw new Error('Wallet not connected');
        
        const client = Client.forTestnet();
        const buyerId = AccountId.fromString(accountId);
        const treasuryId = AccountId.fromString(CONFIG.treasuryId);
        const totalCost = tokenAmount * CONFIG.pricePerToken;
        
        const hbarTransfer = new TransferTransaction()
          .addHbarTransfer(buyerId, Hbar.fromTinybars(-totalCost))
          .addHbarTransfer(treasuryId, Hbar.fromTinybars(totalCost))
          .setNodeAccountIds([new AccountId(3)])
          .freezeWith(client);
        
        const signResult = await connector.signTransaction({
          signerAccountId: `hedera:${CONFIG.network}:${accountId}`,
          transactionBody: hbarTransfer
        });
        
        const signedTx = signResult as Transaction;
        const signedTxBytes = Buffer.from(signedTx.toBytes()).toString('base64');
        
        const res = await fetch(`${CONFIG.backendUrl}/api/purchase`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ signedTransaction: signedTxBytes, tokenId: CONFIG.tokenId, tokenAmount, buyerAccountId: accountId })
        });
        
        const result = await res.json();
        
        if (result.success) {
          showToast(`Successfully purchased ${result.tokensReceived} tokens!`, 'success');
          await fetchBalance(accountId);
          await fetchQuote(tokenAmount);
        } else {
          setError(result.error || 'Purchase failed');
        }
      } catch (err) { setError(err.message || 'Purchase failed'); }
      finally { purchasing = false; render(); }
    }

    // Start
    initialize().catch(() => {});
    render();
  </script>
</body>
</html>
